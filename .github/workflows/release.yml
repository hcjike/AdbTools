name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 可选：若未把 AdbTools.snk 提交到仓库，可用该 Secret(base64) 在 CI 中还原强名称密钥
      SNK_BASE64: ${{ secrets.SNK_BASE64 }}
      # 可选：Authenticode 代码签名证书（base64 的 .pfx 与密码）；留空则跳过签名
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 构建“默认分支”的最新代码（tag 仅用于取版本号），
          # 避免 Release 的 tag 指向旧提交、不包含最新修复。
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $v = $tag.TrimStart('v', 'V')
          if ([string]::IsNullOrWhiteSpace($v)) { throw "无法从 tag 解析版本号：$tag" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version = $v"

      - name: Restore strong-name key (optional)
        if: ${{ env.SNK_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD/AdbTools.snk", [Convert]::FromBase64String($env:SNK_BASE64))
          Write-Host "已从 Secret 还原 AdbTools.snk"

      - name: Bump assembly versions
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          # 主程序：直接改写 AssemblyInfo.cs 的版本特性
          $f = Join-Path $PWD "AdbTools/Properties/AssemblyInfo.cs"
          $c = [IO.File]::ReadAllText($f, [Text.Encoding]::UTF8)
          $c = [regex]::Replace($c, 'AssemblyVersion\("[^"]*"\)', ('AssemblyVersion("' + $v + '")'))
          $c = [regex]::Replace($c, 'AssemblyFileVersion\("[^"]*"\)', ('AssemblyFileVersion("' + $v + '")'))
          [IO.File]::WriteAllText($f, $c, (New-Object Text.UTF8Encoding($true)))
          Write-Host "AdbTools/Properties/AssemblyInfo.cs -> $v"
          # 安装器/卸载器为 SDK 项目，版本通过构建参数 /p:Version 注入（见下方构建步骤）

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Fetch .NET Framework 4.6 reference assemblies
        shell: pwsh
        run: |
          # CI 运行器缺少 .NET Framework 4.6 目标包：下载 NuGet 参考程序集，用 TargetFrameworkRootPath 指过去
          $out = Join-Path $env:RUNNER_TEMP "refpkgs"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net46 -Version 1.0.3 -OutputDirectory $out -NonInteractive
          $v46 = Get-ChildItem $out -Recurse -Directory -Filter "v4.6" |
                   Where-Object { $_.Parent.Name -eq ".NETFramework" } | Select-Object -First 1
          if (-not $v46) { throw "未找到 .NET Framework 4.6 参考程序集" }
          $ref = $v46.Parent.Parent.FullName   # ...\build
          "TFM_ROOT=$ref" >> $env:GITHUB_ENV
          Write-Host "TFM_ROOT=$ref"

      - name: Build installer (single-file exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          msbuild "AdbToolsInstaller/AdbToolsInstaller.csproj" `
            /restore `
            /p:Configuration=Release /p:Platform=AnyCPU `
            /p:Version=$v `
            "/p:TargetFrameworkRootPath=$env:TFM_ROOT" `
            /t:Build /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }

      - name: Rename installer with version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $src = "AdbToolsInstaller/bin/Release/AdbToolsInstaller.exe"
          $dst = "AdbToolsInstaller/bin/Release/AdbToolsInstaller-$v.exe"
          if (-not (Test-Path $src)) { throw "未找到构建产物：$src" }
          Copy-Item $src $dst -Force
          "ASSET_PATH=$dst" >> $env:GITHUB_ENV
          Write-Host "安装包已重命名为 $dst"

      - name: Authenticode sign (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          & signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "$env:ASSET_PATH"
          if ($LASTEXITCODE -ne 0) { throw "代码签名失败" }

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 仅上传安装包 exe（文件名带版本号，如 AdbToolsInstaller-1.5.2.exe），不上传签名文件
          gh release upload "${{ github.event.release.tag_name }}" "$env:ASSET_PATH" --clobber
